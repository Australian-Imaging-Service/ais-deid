[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ais-deid"
version = "0.1.0"
description = "De-identify DICOM metadata using pydicom/deid"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    {name = "Kirsten (Kirsty) Murray", email = "kirsty.murray@newcastle.edu.au"},
]
maintainers = [
    {name = "Australian Imaging Service"},
    {name = "Kirsten (Kirsty) Murray", email = "kirsty.murray@newcastle.edu.au"},
]
dependencies = [
    "deid>=0.3",
    "pydicom>=2.4",
    "click>=8.1",
    "rich>=13.0",          # coloured logging / progress bars
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-tmp-files>=0.0.2",
    "pydicom",
    "pre-commit",
    "flake8",
    "flake8-bugbear",
]

# Installs the `dicom-deid` shell command
[project.scripts]
dicom-deid = "ais_deid.dicom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ais_deid"]

# ── Flake8 (via .flake8 file) ──────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--cov=ais_deid.dicom --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src/ais_deid"]
omit   = ["tests/*"]
