# Kubernetes Job for DICOM de-identification
# Mirrors Edge_De-id's edge_de-id_YAML.yml pattern but adds:
#   - Secret-backed env vars (never plaintext salt)
#   - Resource requests/limits
#   - Non-root security context
#   - Restart/backoff policy
#   - Separate validate step as an init container

apiVersion: batch/v1
kind: Job
metadata:
  name: dicom-deid
  labels:
    app: dicom-deid
spec:
  # Retain completed pods for log inspection; set to 0 in high-throughput pipelines
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2

  template:
    metadata:
      labels:
        app: dicom-deid
    spec:
      restartPolicy: OnFailure

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # ── Init container: validate output after de-id ─────────────────────
      initContainers: []
      # Uncomment to add a post-process validation step:
      # - name: validate
      #   image: ghcr.io/your-org/dicom-deid:latest
      #   args: ["validate", "--input", "/output"]
      #   volumeMounts:
      #     - name: output-volume
      #       mountPath: /output

      containers:
        - name: dicom-deid
          image: ghcr.io/your-org/dicom-deid:latest
          imagePullPolicy: Always

          args:
            - process
            - --input
            - /input
            - --output
            - /output
            - --recipe
            - /config/recipe.dicom

          env:
            # DEID_SALT is injected from a Kubernetes Secret — never plaintext
            - name: DEID_SALT
              valueFrom:
                secretKeyRef:
                  name: dicom-deid-secrets
                  key: deid-salt

            # Date jitter in days (can be overridden per-job via ConfigMap)
            - name: DEID_DATE_JITTER
              valueFrom:
                configMapKeyRef:
                  name: dicom-deid-config
                  key: date-jitter
                  optional: true   # Falls back to image default (0)

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"

          volumeMounts:
            - name: input-volume
              mountPath: /input
              readOnly: true
            - name: output-volume
              mountPath: /output
            - name: recipe-volume
              mountPath: /config
              readOnly: true

      volumes:
        - name: input-volume
          persistentVolumeClaim:
            claimName: dicom-input-pvc

        - name: output-volume
          persistentVolumeClaim:
            claimName: dicom-output-pvc

        # Recipe stored as a ConfigMap so it can be updated without rebuilding the image
        - name: recipe-volume
          configMap:
            name: dicom-deid-recipe

---
# ConfigMap: recipe file loaded from recipe.dicom
# Apply with: kubectl create configmap dicom-deid-recipe --from-file=recipe.dicom=recipe.dicom
apiVersion: v1
kind: ConfigMap
metadata:
  name: dicom-deid-recipe

---
# ConfigMap: runtime tuning parameters
apiVersion: v1
kind: ConfigMap
metadata:
  name: dicom-deid-config
data:
  date-jitter: "0"

---
# Secret template: copy this and fill in your base64-encoded salt
# Generate salt:  python -c "import secrets; print(secrets.token_hex(32))"
# Encode:         echo -n "your_salt_here" | base64
apiVersion: v1
kind: Secret
metadata:
  name: dicom-deid-secrets
type: Opaque
data:
  deid-salt: REPLACE_WITH_BASE64_ENCODED_SALT
